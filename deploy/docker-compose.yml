services:
  identity-service:
    build:
      context: ../src/identity-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set via .env}
      - INTERNAL_KEY=${INTERNAL_KEY:?INTERNAL_KEY must be set via .env}
    volumes:
      - identity-data:/app/data

  trip-service:
    build:
      context: ../src/trip-service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set via .env}
      - INTERNAL_KEY=${INTERNAL_KEY:?INTERNAL_KEY must be set via .env}
      - URL_BROKER=${URL_BROKER:-http://broker-service:4000}
    volumes:
      - trip-data:/app/data

volumes:
  identity-data:
  trip-data:
